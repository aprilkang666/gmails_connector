[project]
name = "gmail-mcp"
version = "0.1.0"
description = "MCP server for multiple Gmail and Outlook accounts: local for Claude Code, or remote as a claude.ai custom connector"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "msal>=1.31.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
]

[project.scripts]
gmail-mcp-remote = "gmail_mcp.remote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = [
    # anyio's pytest plugin (pulled in via mcp) uses a deprecated pytest alias.
    "ignore:_pytest.python.CallSpec2 has been renamed",
]
