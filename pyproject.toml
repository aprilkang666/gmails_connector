[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Local MCP server for managing multiple Gmail accounts from Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "msal>=1.31.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]
